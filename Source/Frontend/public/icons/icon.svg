<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Finanzen">
  <title>Finanzen</title>
  <defs>
    <!-- Marine-Verlauf der Markenfläche, identisch zu --fin-gradient-brand. -->
    <linearGradient id="brand" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#16233f" />
      <stop offset="0.58" stop-color="#1e3050" />
      <stop offset="1" stop-color="#1c3b52" />
    </linearGradient>
    <!-- Weicher Teal-Schein oben rechts, wie auf .fin-brand-surface. -->
    <radialGradient id="sheen" cx="0.88" cy="-0.1" r="1.1">
      <stop offset="0" stop-color="#2fa79f" stop-opacity="0.34" />
      <stop offset="0.62" stop-color="#2fa79f" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#brand)" />
  <rect width="512" height="512" rx="116" fill="url(#sheen)" />

  <!-- Geldbörse: Korpus, Klappe, Verschluss. -->
  <rect x="112" y="164" width="288" height="196" rx="40" fill="#ffffff" fill-opacity="0.94" />
  <path
    d="M112 226h288v-22a40 40 0 0 0-40-40H152a40 40 0 0 0-40 40z"
    fill="#ffffff"
    fill-opacity="0.62"
  />
  <rect x="268" y="238" width="132" height="60" rx="30" fill="#2fa79f" />
  <circle cx="322" cy="268" r="17" fill="#0b1220" fill-opacity="0.82" />
</svg>
